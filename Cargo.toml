[workspace]
members = ["pkg/runtime", "cmd/pd-server"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
astersql-pd-runtime = { path = "pkg/runtime" }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }

[package]
name = "astersql-pd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "pkg/lib.rs"

[dependencies]
astersql-pd-runtime.workspace = true
