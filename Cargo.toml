[workspace]
members = ["pkg/cache", "pkg/ratelimit", "pkg/window", "pkg/btree", "pkg/balancer", "pkg/storage/raft-prototype", "pkg/server", "pkg/runtime", "cmd/pd-server", "pkg/proto", "tests/rust-compat", "pkg/storage", "pkg/member", "pkg/id", "pkg/tso", "pkg/core/constant", "pkg/keyspace/constant", "pkg/mcs/utils/constant", "pkg/versioninfo/kerneltype", "pkg/slice", "pkg/codec", "pkg/utils/reflectutil", "pkg/utils/syncutil", "pkg/utils/timerutil", "pkg/utils/typeutil", "pkg/movingaverage", "pkg/errs", "pkg/utils/jsonutil", "pkg/utils/keyutil"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
astersql-pd-cache = { path = "pkg/cache" }
astersql-pd-ratelimit = { path = "pkg/ratelimit" }
astersql-pd-window = { path = "pkg/window" }
astersql-pd-keyutil = { path = "pkg/utils/keyutil" }
astersql-pd-btree = { path = "pkg/btree" }
astersql-pd-balancer = { path = "pkg/balancer" }
astersql-pd-jsonutil = { path = "pkg/utils/jsonutil" }
astersql-pd-core-constant = { path = "pkg/core/constant" }
astersql-pd-keyspace-constant = { path = "pkg/keyspace/constant" }
astersql-pd-mcs-constant = { path = "pkg/mcs/utils/constant" }
astersql-pd-kerneltype = { path = "pkg/versioninfo/kerneltype" }
astersql-pd-slice = { path = "pkg/slice" }
astersql-pd-codec = { path = "pkg/codec" }
astersql-pd-reflectutil = { path = "pkg/utils/reflectutil" }
astersql-pd-syncutil = { path = "pkg/utils/syncutil" }
astersql-pd-timerutil = { path = "pkg/utils/timerutil" }
astersql-pd-typeutil = { path = "pkg/utils/typeutil" }
astersql-pd-movingaverage = { path = "pkg/movingaverage" }
astersql-pd-errs = { path = "pkg/errs" }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
protobuf = "=2.28.0"
slog = "=2.8.2"
astersql-pd-server = { path = "pkg/server" }
axum = "=0.8.9"
futures-util = "=0.3.34"
tokio-stream = "=0.1.19"
prometheus = { version = "=0.14.0", default-features = false }

astersql-pd-tso = { path = "pkg/tso" }
astersql-pd-member = { path = "pkg/member" }
astersql-pd-id = { path = "pkg/id" }
async-trait = "=0.1.92"
thiserror = "=2.0.21"
etcd-client = { version = "=0.17.0", features = ["tls", "tls-roots"] }
astersql-pd-storage = { path = "pkg/storage" }
prost = "=0.14.1"
prost-types = "=0.14.1"
tonic = "=0.14.2"
tonic-prost = "=0.14.2"
tonic-prost-build = "=0.14.2"
protoc-bin-vendored = "=3.2.0"
serde = "=1.0.229"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
astersql-pd-runtime = { path = "pkg/runtime" }
astersql-pd-proto = { path = "pkg/proto" }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }

[package]
name = "astersql-pd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "pkg/lib.rs"

[dependencies]
astersql-pd-runtime.workspace = true
