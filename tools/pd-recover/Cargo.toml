[package]
name = "astersql-pd-recover"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "pd-recover"
path = "bin_main.rs"

[dependencies]
astersql-pd-keypath.workspace = true
astersql-pd-storage-endpoint.workspace = true
astersql-pd-storage-kv.workspace = true
etcd-client.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
astersql-pd-backup.workspace = true
astersql-pd-proto.workspace = true
astersql-pd-runtime.workspace = true
prometheus.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tokio-util.workspace = true
tokio-stream.workspace = true

[[test]]
name = "recover_roundtrip"
path = "roundtrip_test.rs"
