[workspace]
members = ["pkg/runtime", "cmd/pd-server", "pkg/proto", "tests/rust-compat", "pkg/storage"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "=0.1.92"
thiserror = "=2.0.21"
etcd-client = { version = "=0.17.0", features = ["tls", "tls-roots"] }
astersql-pd-storage = { path = "pkg/storage" }
prost = "=0.14.1"
prost-types = "=0.14.1"
tonic = "=0.14.2"
tonic-prost = "=0.14.2"
tonic-prost-build = "=0.14.2"
protoc-bin-vendored = "=3.2.0"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
astersql-pd-runtime = { path = "pkg/runtime" }
astersql-pd-proto = { path = "pkg/proto" }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.17", features = ["rt"] }

[package]
name = "astersql-pd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "pkg/lib.rs"

[dependencies]
astersql-pd-runtime.workspace = true
