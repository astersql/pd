astersql-pd-metricutil = { path = "pkg/utils/metricutil" }
astersql-pd-logutil = { path = "pkg/utils/logutil" }
astersql-pd-encryption = { path = "pkg/encryption" }
astersql-pd-rm-server = { path = "pkg/mcs/resourcemanager/server" }
